[package]
name = "qwen-nv"
version = "0.7.0"
edition = "2021"
description = "Zero-Docker, Zero-Middleware Native macOS ARM64 Rust Runtime & GA102 (sm_86) Persistent Megakernel Engine for Modular Qwen Text + Mechanistic Weight Surgery + Co-Resident Neural Drafter + Same-Model RAG (.qvec) + STT + TTS + Fused LoRA"

[[bin]]
